<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moneyville Adventures — Multiplayer</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>🌈 Moneyville Adventures</h1><p>Every Choice Counts! · Save $100 to buy your bicycle 🚲</p></header><section id="entry" class="panel"><h2>Join the Adventure</h2><label>Your first name<input id="name" maxlength="20" placeholder="e.g. Jordan"></label><div class="actions"><button id="create">Create a room</button></div><div class="join"><label>Room code<input id="code" maxlength="5" placeholder="ABCDE" autocapitalize="characters"></label><button id="join">Join room</button></div><p class="small">Share the room code with friends on other devices. One person creates the room, then everyone else joins.</p></section><section id="game" hidden><div class="topline"><div class="panel"><strong>Room: <span id="roomcode"></span></strong> <button id="copy" class="secondary">Copy code</button><p id="status"></p><button id="start" hidden>Start Game</button></div><div class="panel" id="turn"></div></div><div class="board" id="board"></div><div class="layout"><section class="panel"><h2>Players & Savings</h2><div id="players"></div></section><section class="panel"><h2>Current Turn</h2><div id="card"></div><button id="roll" hidden>🎲 Roll 1–3</button></section></div><section class="panel"><h2>Adventure Log</h2><div id="log" aria-live="polite"></div></section></section><p id="error" role="alert"></p></main><script src="app.js"></script></body></html>
